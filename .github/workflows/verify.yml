name: Verify research software
on: [push, pull_request, workflow_dispatch]
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[data,learning,survival,thermo,sensitivity,bdd,dev]"
      - run: python scripts/run_verification.py
      - run: python scripts/inventory_environment.py
      - run: python scripts/build_release.py
