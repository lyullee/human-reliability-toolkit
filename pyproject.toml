[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-reliability-toolkit"
version = "0.4.0"
description = "Composable, evidence-qualified human reliability and process-risk models"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "DATA_LICENSES.md"]
authors = [{name = "Ugwiyeon Lee"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.14,<2", "pydantic>=2.10,<3"]

[project.optional-dependencies]
data = ["pandas>=2.2,<4", "openpyxl>=3.1,<4", "xlrd>=2,<3", "rdata>=1,<2"]
curation = ["pdfplumber>=0.11,<1"]
learning = ["scikit-learn>=1.5,<2", "pandas>=2.2,<4"]
survival = ["lifelines>=0.30,<1", "pandas>=2.2,<4"]
thermo = ["CoolProp>=7.1,<9"]
sensitivity = ["SALib>=1.5,<2"]
bdd = ["dd>=0.6,<1"]
dynamics = ["simpy>=4.1.2,<5"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "build>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
human-reliability = "human_reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
human_reliability = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
